<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KPI NSO Gr.4</title>

  <meta
    name="description"
    content="ระบบบันทึกและติดตามตัวชี้วัด NSO Group 4"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Thai", sans-serif;
      min-height: 100vh;
      color: #172033;
      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255, 255, 255, 0.08),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #173777 0%,
          #254596 55%,
          #173777 100%
        );
    }

    .topbar {
      width: 100%;
      padding: 18px 28px;
      background: rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .topbar-inner {
      max-width: 1180px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-weight: 700;
    }

    .brand-logo-box {
      width: 50px;
      height: 50px;
      border-radius: 13px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.13);
    }

    .brand-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      font-size: 21px;
      line-height: 1.15;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #ffd84d;
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 42px 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 46px 42px 36px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
    }

    .app-logo-box {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      background: #eff5ff;
      border: 1px solid #dce8fa;
      border-radius: 24px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    h1 {
      color: #173777;
      font-size: 30px;
      margin-bottom: 9px;
    }

    .subtitle {
      color: #64748b;
      line-height: 1.75;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .login-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      background: #254596;
      color: #ffffff;
      border-radius: 12px;
      padding: 16px 22px;
      font-size: 17px;
      font-weight: 700;
      transition: 0.2s ease;
      box-shadow: 0 8px 20px rgba(37, 69, 150, 0.24);
    }

    .login-button:hover {
      background: #183778;
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 69, 150, 0.3);
    }

    .notice {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      line-height: 1.65;
      border: 1px solid #e5e7eb;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 28px 0 18px;
    }

    .footer-text {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      padding: 16px 20px 24px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 14px 18px;
      }

      .brand-logo-box {
        width: 44px;
        height: 44px;
      }

      .brand-title {
        font-size: 18px;
      }

      .card {
        padding: 38px 24px 30px;
        border-radius: 20px;
      }

      .app-logo-box {
        width: 84px;
        height: 84px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <div class="brand">
        <div class="brand-logo-box">
          <img src="BDMS_Logo.svg" alt="BDMS Logo">
        </div>

        <div>
          <div class="brand-title">KPI NSO Gropu 4</div>
          <div class="brand-subtitle">NSO Group 4</div>
        </div>
      </div>

    </div>
  </header>

  <main>

    <section class="card">

      <div class="app-logo-box">
        <img src="BDMS_Logo.svg" alt="BDMS Logo">
      </div>

      <h1>KPI NSO Gr.4</h1>

      <div class="subtitle">
        ระบบบันทึกและติดตามตัวชี้วัดเครือข่ายพยาบาล
        <br>
        NSO Group 4
      </div>

      <a
        class="login-button"
        href="https://script.google.com/macros/s/AKfycbyImXfza_bIV12K1OJPzESj-F_XNNGNJJlqSgbLg5ctQe-QaCr-L-oy4G8Ctm1D05zlnw/exec"
        target="_self"
        rel="noopener"
      >
        ➜ เข้าสู่ระบบ KPI NSO Gr.4
      </a>

      <div class="notice">
        กรุณาเข้าสู่ระบบผ่านปุ่มด้านบน
        <br>
        Username และ Password จะถูกตรวจสอบภายในระบบ KPI NSO Gr.4
      </div>

      <div class="divider"></div>

      <div class="footer-text">
        Bangkok Dusit Medical Services (BDMS)
        <br>
        NSO Group 4
      </div>

    </section>

  </main>

  <footer>
    KPI NSO Group 4 · NSO Group 4
  </footer>

</body>
</html>
